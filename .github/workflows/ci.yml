name: Bread Master CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  demo-image:
    name: Demo image smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t bread-master-demo .
      - name: Check container web and API
        shell: bash
        run: |
          docker run -d --name demo -p 8001:8000 bread-master-demo
          trap 'docker logs demo; docker stop demo' EXIT
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8001/api/v1/health
          curl --fail http://127.0.0.1:8001/ > /tmp/demo-page.html
          grep -q 'root' /tmp/demo-page.html
          python - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:8001'
          products=json.load(urllib.request.urlopen(base+'/api/v1/products'))
          assert len(products)==176
          request=urllib.request.Request(base+'/api/v1/questions',data=b'{"mode":"name"}',headers={'Content-Type':'application/json'})
          question=json.load(urllib.request.urlopen(request))
          assert len(question['options']) in (2,3)
          PY
